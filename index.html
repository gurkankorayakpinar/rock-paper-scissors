<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taş, Kâğıt, Makas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Taş, Kâğıt, Makas</h1>
        <div class="choices">
            <button id="rock" class="choice-btn">Taş</button>
            <button id="paper" class="choice-btn">Kâğıt</button>
            <button id="scissors" class="choice-btn">Makas</button>
        </div>
        <div id="playerChoice" class="selection">
            <p>Senin seçimin: <span id="playerSelection"></span></p>
        </div>
        <div id="computerChoice" class="selection">
            <p>Bilgisayarın seçimi: <span id="computerSelection"></span></p>
        </div>
        <div id="gameResult" class="result"></div>
        <div id="scoreboard" class="scoreboard">
            <p>Sen: <span id="playerScore">0</span></p>
            <p>Bilgisayar: <span id="computerScore">0</span></p>
        </div>
        <div id="finalResult" class="final-result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
